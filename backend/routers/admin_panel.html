<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智学 AI · 运营后台</title>
<style>
  :root {
    --primary: #165dff;
    --primary-dark: #0f4ad1;
    --bg: #f4f6fa;
    --sidebar: #1b2437;
    --sidebar-active: #165dff;
    --text: #2b3245;
    --muted: #8a94a6;
    --border: #e4e9f2;
    --danger: #e5484d;
    --success: #30a46c;
    --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; height: 100vh; }
  /* 侧边栏 */
  .sidebar { width: 240px; background: var(--sidebar); color: #c8d0df; display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { padding: 20px 18px; font-size: 17px; font-weight: 700; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .logo span { color: var(--primary); }
  .nav { flex: 1; overflow-y: auto; padding: 10px 0; }
  .nav-group { font-size: 11px; color: #6b7599; padding: 14px 18px 6px; letter-spacing: 1px; }
  .nav-item { padding: 10px 18px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: background .15s; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: var(--sidebar-active); color: #fff; }
  .nav-item .dot { width: 8px; height: 8px; border-radius: 2px; background: rgba(255,255,255,0.25); }
  .nav-item.active .dot { background: #fff; }
  .sidebar-foot { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #6b7599; }
  .sidebar-foot button { background: none; border: 1px solid rgba(255,255,255,0.2); color: #c8d0df; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 8px; }
  .sidebar-foot button:hover { background: rgba(255,255,255,0.1); }
  /* 主内容 */
  .main { flex: 1; overflow-y: auto; padding: 24px 28px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-head h1 { font-size: 20px; }
  .page-head .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: #fff; color: var(--danger); border: 1px solid #f5c6c7; }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  /* 统计卡片 */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card .num { font-size: 26px; font-weight: 700; color: var(--primary); }
  .card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card .num.green { color: var(--success); }
  .card .num.orange { color: #ff9e2c; }
  /* 表格 */
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-toolbar { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel-toolbar input[type=text] { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; width: 240px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 12px 14px; background: #f8fafd; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 1px solid var(--border); }
  td { padding: 11px 14px; border-bottom: 1px solid #eef1f7; vertical-align: top; }
  tr:hover td { background: #fafbfe; }
  td .cell { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td .cell.json { color: #6b7280; font-family: monospace; font-size: 12px; }
  .row-actions { display: flex; gap: 6px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  /* Modal */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 560px; max-width: 92vw; max-height: 88vh; overflow-y: auto; padding: 24px; }
  .modal h3 { font-size: 17px; margin-bottom: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-item { display: flex; flex-direction: column; }
  .form-item.full { grid-column: 1 / -1; }
  .form-item label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .form-item input, .form-item select, .form-item textarea {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical;
  }
  .form-item input:focus, .form-item select:focus, .form-item textarea:focus { outline: none; border-color: var(--primary); }
  .form-item textarea { min-height: 70px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  /* 登录页 */
  .login { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1b2437 0%, #165dff 120%); }
  .login-box { background: #fff; border-radius: 16px; padding: 40px 36px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .login-box h2 { font-size: 20px; margin-bottom: 6px; }
  .login-box .tip { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  .login-box .form-item { margin-bottom: 16px; }
  .login-box .btn { width: 100%; padding: 12px; }
  .login-err { color: var(--danger); font-size: 13px; margin-bottom: 10px; display: none; }
  /* 看板等级分布 */
  .levels { display: flex; flex-wrap: wrap; gap: 10px; }
  .level-chip { background: #f0f4ff; color: var(--primary); padding: 8px 14px; border-radius: 20px; font-size: 13px; }
  /* toast */
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); }
</style>
</head>
<body>

<div id="loginPage" class="login" style="display:none">
  <div class="login-box">
    <h2>智学 AI 运营后台</h2>
    <div class="tip">零基础 AI 教学服务平台 · 押金式培训版</div>
    <div class="login-err" id="loginErr"></div>
    <div class="form-item">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="admin" value="admin">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="admin123" value="admin123">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">登录</button>
  </div>
</div>

<div id="appPage" class="app" style="display:none">
  <div class="sidebar">
    <div class="logo">智学 AI · <span>运营后台</span></div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-foot">
      <div id="whoami" style="margin-bottom:6px"></div>
      <button onclick="logout()">退出登录</button>
    </div>
  </div>
  <div class="main" id="mainArea"></div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle">编辑</h3>
    <div class="form-grid" id="modalForm"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 常量与状态 ============
const API = '/api/admin';
let TOKEN = localStorage.getItem('admin_token') || '';
let TABLES = [];          // [{name, label, fields}]
let CURRENT = null;       // 当前表或 'dashboard'
let EDITING = null;       // 正在编辑的行
let EDIT_ID = null;

// 字段名 → 中文
const FIELD_LABELS = {
  id: 'ID', title: '标题', description: '描述', cover_img: '封面图', coverImg: '封面图', cover_url: '封面图',
  topic: '主题', topic_key: '主题关键词', difficulty: '难度', estimated_hours: '预计学时', lessons: '节数',
  progress: '进度', is_free: '是否免费', price: '价格', source: '来源', chapters: '章节', is_active: '是否启用',
  created_at: '创建时间', updated_at: '更新时间', image_url: '图片地址', link_url: '跳转链接', sort_order: '排序',
  name: '名称', color: '颜色', icon: '图标', label: '名称', path: '路径', section: '分区',
  tech_stack: '技术栈', step_count: '步骤数', status: '状态', topics_covered: '覆盖主题',
  subtitle: '副标题', core_info: '核心信息', narrative: '讲解文案', visual: '视觉呈现', quality: '质量参数',
  url: '视频地址', duration: '时长', chapter: '章节', course_id: '课程ID',
  direction: '方向', total_weeks: '总周数', current_week: '当前周', nodes: '节点',
  job_title: '岗位名称', company: '公司', match_score: '匹配度', required_skills: '必备技能',
  gap_skills: '差距技能', recommended_courses: '推荐课程', recommended_projects: '推荐项目',
  learning_days: '学习天数', total_hours: '总时长', completed_projects: '完成项目数', completed_lessons: '完成课时',
  date: '日期', lessons_completed: '完成课时', exercises_done: '完成练习',
  openid: '微信OpenID', unionid: '微信UnionID', nickname: '昵称', avatar: '头像',
  grade: '年级', major: '专业', target_direction: '目标方向',
  user_id: '用户ID', amount: '金额', currency: '币种', enrolled_at: '报名时间', deadline_at: '截止时间',
  refund_amount: '退费金额', refund_at: '退费时间', overall_score: '总分', level: '等级',
  dimensions: '能力维度', strengths: '优势', weaknesses: '薄弱项', recommended_direction: '推荐方向',
  checkin_date: '打卡日期', note: '备注', content: '内容', category: '分类', likes: '点赞数',
  post_id: '帖子ID', question: '问题', answer: '答案', view_count: '浏览次数',
  code: '邀请码', owner_id: '队长ID', member_count: '成员数', max_members: '人数上限',
  team_id: '小组ID', joined_at: '加入时间', share_type: '分享类型', share_target: '分享目标',
  unlocked_content: '解锁内容', enTitle: '英文标题', enDescription: '英文描述',
};

// 表 → 导航分组
const GROUP_MAP = {
  'banners': '首页内容', 'directions': '首页内容', 'menu_items': '首页内容',
  'courses': '课程内容', 'projects': '课程内容', 'videos': '课程内容', 'learning_paths': '课程内容', 'job_matching': '课程内容',
  'learning_stats': '课程内容', 'learning_records': '课程内容',
  'users': '用户体系', 'user_deposits': '用户体系', 'user_ability_reports': '用户体系',
  'checkins': '平台运营', 'community_posts': '平台运营', 'community_replies': '平台运营',
  'faq_items': '答疑管理', 'teams': '平台运营', 'team_members': '平台运营', 'share_unlocks': '平台运营',
};
const GROUP_ORDER = ['数据看板', '复核', '首页内容', '课程内容', '用户体系', '答疑管理', '平台运营'];

// ============ 工具 ============
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => t.className = 'toast', 2200);
}
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.message || ('HTTP ' + res.status));
  return data;
}

// ============ 登录 ============
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginErr');
  try {
    const r = await fetch(API + '/login?username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p), { method: 'POST' });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || '登录失败');
    TOKEN = data.token;
    localStorage.setItem('admin_token', TOKEN);
    document.getElementById('whoami').textContent = '管理员：' + data.username;
    enterApp();
  } catch (e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
  }
}
function logout() {
  TOKEN = '';
  localStorage.removeItem('admin_token');
  show('loginPage'); hide('appPage');
}

// ============ 初始化 ============
function show(id) { document.getElementById(id).style.display = 'flex'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

async function enterApp() {
  show('appPage'); hide('loginPage');
  await loadTables();
  renderNav();
  renderDashboard();
}

async function loadTables() {
  try { TABLES = await api('GET', '/tables'); }
  catch (e) { toast('加载表失败：' + e.message, true); TABLES = []; }
}

function renderNav() {
  const nav = document.getElementById('navList');
  const groups = {};
  // 数据看板
  groups['数据看板'] = [{ name: 'dashboard', label: '数据看板', icon: '📊' }];
  groups['复核'] = [
    { name: 'homework', label: '作业复核', icon: '✍' },
    { name: 'refund-review', label: '退费复核', icon: '💳' },
  ];
  for (const t of TABLES) {
    const g = GROUP_MAP[t.name] || '其他';
    (groups[g] = groups[g] || []).push(t);
  }
  let html = '';
  for (const g of GROUP_ORDER) {
    if (!groups[g]) continue;
    html += `<div class="nav-group">${g}</div>`;
    for (const item of groups[g]) {
      const key = item.name === 'dashboard' ? 'dashboard' : 'tbl:' + item.name;
      html += `<div class="nav-item" data-key="${key}" onclick="navTo('${key}')">
        <span class="dot"></span>${esc(item.label)}</div>`;
    }
  }
  for (const g of Object.keys(groups)) {
    if (!GROUP_ORDER.includes(g)) {
      html += `<div class="nav-group">${g}</div>`;
      for (const item of groups[g]) {
        const key = 'tbl:' + item.name;
        html += `<div class="nav-item" data-key="${key}" onclick="navTo('${key}')">
          <span class="dot"></span>${esc(item.label)}</div>`;
      }
    }
  }
  nav.innerHTML = html;
}

function navTo(key) {
  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.key === key));
  if (key === 'dashboard') renderDashboard();
  else if (key === 'tbl:homework') renderHomework();
  else if (key === 'tbl:refund-review') renderRefundReview();
  else {
    const name = key.replace('tbl:', '');
    CURRENT = TABLES.find(t => t.name === name) || null;
    if (CURRENT) renderTable();
  }
}

// ============ 数据看板 ============
async function renderDashboard() {
  const area = document.getElementById('mainArea');
  area.innerHTML = '<div style="padding:40px;text-align:center;color:#8a94a6">加载中...</div>';
  try {
    const d = await api('GET', '/dashboard');
    const cards = [
      ['用户总数', d.users, ''], ['押金报名', d.enrolled_users, 'green'], ['已退费', d.refunded, 'orange'],
      ['累计打卡', d.checkins, ''], ['社区帖子', d.posts, ''], ['社区回复', d.replies, ''],
      ['视频观看', d.videos_watched, 'green'], ['测评次数', d.assessments, ''],
      ['FAQ 条目', d.faq_count, ''], ['学习小组', d.teams_count, ''], ['平均测评分', d.avg_score ?? '-', ''],
    ];
    const lvHtml = Object.entries(d.assess_levels || {}).map(([k, v]) =>
      `<span class="level-chip">${esc(k)}：${v}</span>`).join('') || '<span class="level-chip">暂无数据</span>';
    area.innerHTML = `
      <div class="page-head">
        <div>
          <h1>运营数据看板</h1>
          <div class="sub">用户数 / 完课率 / 测评分布 / 答疑量 / 押金退费率</div>
        </div>
        <button class="btn btn-ghost" onclick="renderDashboard()">🔄 刷新</button>
      </div>
      <div class="cards">
        ${cards.map(([label, num, cls]) => `
          <div class="card"><div class="num ${cls}">${num}</div><div class="label">${label}</div></div>`).join('')}
      </div>
      <div class="panel" style="padding:18px">
        <div style="font-size:15px;font-weight:600;margin-bottom:12px">测评等级分布</div>
        <div class="levels">${lvHtml}</div>
      </div>`;
  } catch (e) {
    if (String(e.message).includes('401')) { toast('登录已过期，请重新登录', true); logout(); return; }
    area.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

// ============ 作业复核（过程锁 · 人工改判防刷） ============
async function renderHomework() {
  const area = document.getElementById('mainArea');
  area.innerHTML = '<div style="padding:40px;text-align:center;color:#8a94a6">加载中...</div>';
  try {
    const d = await api('GET', '/api/admin/homework/reviews?status=all');
    const rows = d.reviews || [];
    const stageName = {1:'认知',2:'入门',3:'进阶',4:'实战',5:'熟练'};
    const statusChip = s => s === 'passed'
      ? '<span style="color:#30a46c;font-weight:600">已通过</span>'
      : '<span style="color:#e5484d;font-weight:600">未通过</span>';
    area.innerHTML = `
      <div class="page-head">
        <div>
          <h1>作业复核</h1>
          <div class="sub">AI 评审结果供参考，人工复核可改判（共 ${rows.length} 条提交）</div>
        </div>
        <button class="btn btn-ghost" onclick="renderHomework()">🔄 刷新</button>
      </div>
      ${rows.length === 0 ? '<div class="empty">暂无作业提交</div>' : rows.map(r => `
        <div class="panel" style="margin-bottom:14px">
          <div class="panel-toolbar" style="flex-wrap:wrap">
            <div>
              <b>${esc(r.user_nickname || '用户' + r.user_id)}</b>
              <span style="margin-left:10px;color:#8a94a6">第 ${r.stage} 阶段（${stageName[r.stage] || ''}）</span>
              <span style="margin-left:10px">${statusChip(r.status)}</span>
              <span style="margin-left:10px;color:#165dff">AI 评分：${r.ai_score}</span>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-primary btn-sm" onclick="judgeHomework(${r.id}, 'passed')">✅ 判通过</button>
              <button class="btn btn-danger btn-sm" onclick="judgeHomework(${r.id}, 'rejected')">❌ 判未通过</button>
            </div>
          </div>
          <div style="padding:14px 18px;white-space:pre-wrap;font-size:13px;line-height:1.7">${esc(r.content)}</div>
          ${r.ai_feedback ? `<div style="padding:0 18px 14px;font-size:12px;color:#8a94a6">AI 反馈：${esc(r.ai_feedback)}</div>` : ''}
        </div>`).join('')}`;
  } catch (e) {
    if (String(e.message).includes('401')) { toast('登录已过期，请重新登录', true); logout(); return; }
    area.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

async function judgeHomework(id, status) {
  const score = prompt('请输入最终评分（0-100）：', status === 'passed' ? '80' : '50');
  if (score === null) return;
  const s = Math.max(0, Math.min(100, parseFloat(score) || 0));
  try {
    await api('POST', '/api/admin/homework/reviews/' + id, { status, score: s });
    toast('已更新该作业判定');
    renderHomework();
  } catch (e) {
    toast('改判失败：' + e.message, true);
  }
}

// ============ 退费复核（防刷：人工放行/驳回） ============
async function renderRefundReview() {
  const area = document.getElementById('mainArea');
  area.innerHTML = '<div style="padding:40px;text-align:center;color:#8a94a6">加载中...</div>';
  try {
    const d = await api('GET', '/api/admin/deposit/refund-reviews');
    const rows = d.reviews || [];
    area.innerHTML = `
      <div class="page-head">
        <div>
          <h1>退费复核</h1>
          <div class="sub">达标学员申请退费后先入此队列，人工复核（含 AI 监考）通过才放行（共 ${rows.length} 笔待复核）</div>
        </div>
        <button class="btn btn-ghost" onclick="renderRefundReview()">🔄 刷新</button>
      </div>
      ${rows.length === 0 ? '<div class="empty">暂无待复核退费申请</div>' : rows.map(r => `
        <div class="panel" style="margin-bottom:14px">
          <div class="panel-toolbar" style="flex-wrap:wrap">
            <div>
              <b>${esc(r.nickname || '用户' + r.user_id)}</b>
              <span style="margin-left:10px;color:#165dff">申请退费 ¥${r.amount}</span>
              <span style="margin-left:10px;color:#8a94a6">申请时间：${esc(r.refund_requested_at)}</span>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-primary btn-sm" onclick="judgeRefund(${r.user_id}, true)">✅ 放行退费</button>
              <button class="btn btn-danger btn-sm" onclick="judgeRefund(${r.user_id}, false)">❌ 驳回</button>
            </div>
          </div>
          <div style="padding:12px 18px;font-size:13px;color:#2b3245;line-height:1.7">
            完课率 ${r.course_completion_rate}% · 作业${r.homework_passed ? '通过' : '未通过'} · 均分 ${r.assessment_avg_score} ·
            项目${r.project_passed ? '通过' : (r.project_submitted ? '待评审' : '未提交')} ·
            死线 ${esc(r.deadline_at)}
          </div>
        </div>`).join('')}`;
  } catch (e) {
    if (String(e.message).includes('401')) { toast('登录已过期，请重新登录', true); logout(); return; }
    area.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

async function judgeRefund(userId, approved) {
  const ok = approved
    ? confirm('确认放行该学员退费？放行后押金记为已退费。')
    : confirm('确认驳回该退费申请？用户押金将回到有效状态。');
  if (!ok) return;
  try {
    const r = await api('POST', '/api/admin/deposit/refund-reviews/' + userId, { approved });
    toast(approved ? '已放行退费' : '已驳回该申请');
    renderRefundReview();
  } catch (e) {
    toast('操作失败：' + e.message, true);
  }
}

// ============ 表管理 ============
let ROWS = [];
let SEARCH = '';
const AUTO_FIELDS = ['id', 'created_at', 'updated_at'];

function isJsonField(name) {
  return ['chapters','tech_stack','topics_covered','nodes','dimensions','strengths','weaknesses',
    'required_skills','gap_skills','recommended_courses','recommended_projects','core_info','quality',
    'enTitle','enDescription'].includes(name);
}

async function renderTable() {
  const area = document.getElementById('mainArea');
  area.innerHTML = '<div style="padding:40px;text-align:center;color:#8a94a6">加载中...</div>';
  try {
    ROWS = await api('GET', '/' + CURRENT.name);
    drawTable();
  } catch (e) {
    if (String(e.message).includes('401')) { toast('登录已过期', true); logout(); return; }
    area.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

function drawTable() {
  const area = document.getElementById('mainArea');
  const fields = CURRENT.fields;
  const filtered = SEARCH
    ? ROWS.filter(r => fields.some(f => String(r[f] ?? '').toLowerCase().includes(SEARCH.toLowerCase())))
    : ROWS;
  const head = fields.filter(f => f !== 'id').map(f => `<th>${esc(FIELD_LABELS[f] || f)}</th>`).join('');
  let body = '';
  for (const r of filtered) {
    const tds = fields.filter(f => f !== 'id').map(f => {
      let v = r[f];
      if (v === null || v === undefined) v = '';
      if (isJsonField(f)) v = JSON.stringify(v);
      if (typeof v === 'object') v = JSON.stringify(v);
      v = String(v);
      if (v.length > 120) v = v.slice(0, 120) + '…';
      return `<td><div class="cell ${isJsonField(f) ? 'json' : ''}" title="${esc(String(r[f]) ?? '')}">${esc(v)}</div></td>`;
    }).join('');
    const id = r.id;
    body += `<tr>
      <td style="color:var(--muted);font-size:12px">${id}</td>
      ${tds}
      <td><div class="row-actions">
        <button class="btn btn-ghost btn-sm" onclick="openEdit(${id})">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="delRow(${id})">删除</button>
      </div></td></tr>`;
  }
  area.innerHTML = `
    <div class="page-head">
      <div>
        <h1>${esc(CURRENT.label)}</h1>
        <div class="sub">共 ${ROWS.length} 条记录</div>
      </div>
      <button class="btn btn-primary" onclick="openCreate()">＋ 新增</button>
    </div>
    <div class="panel">
      <div class="panel-toolbar">
        <input type="text" placeholder="搜索当前表..." value="${esc(SEARCH)}" oninput="SEARCH=this.value;drawTable()">
        <button class="btn btn-ghost btn-sm" onclick="renderTable()">🔄 刷新</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th>${head}<th>操作</th></tr></thead>
          <tbody>${body || `<tr><td colspan="${fields.length + 1}" class="empty">暂无数据</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

// ============ 新增 / 编辑 ============
function openCreate() {
  EDITING = null; EDIT_ID = null;
  const fields = CURRENT.fields.filter(f => !AUTO_FIELDS.includes(f));
  document.getElementById('modalTitle').textContent = '新增 · ' + CURRENT.label;
  buildForm(fields, {});
  show('modalMask');
}
function openEdit(id) {
  const row = ROWS.find(r => r.id === id);
  if (!row) return;
  EDITING = row; EDIT_ID = id;
  const fields = CURRENT.fields.filter(f => !AUTO_FIELDS.includes(f));
  document.getElementById('modalTitle').textContent = '编辑 · ' + CURRENT.label;
  buildForm(fields, row);
  show('modalMask');
}
function buildForm(fields, row) {
  const grid = document.getElementById('modalForm');
  grid.innerHTML = fields.map(f => {
    let val = row[f] ?? '';
    if (val !== '' && isJsonField(f) && typeof val !== 'string') val = JSON.stringify(val);
    const isText = isJsonField(f) || ['description','answer','content','image_url','link_url','cover_img','avatar','narrative','visual'].includes(f);
    const opts = f === 'is_active' || f === 'is_free' || f === 'homework_passed' || f === 'project_submitted' || f === 'project_passed' || f === 'refund_eligible'
      ? `<select data-field="${f}"><option value="1" ${val == 1 || val === '' ? 'selected' : ''}>是 / 1</option><option value="0" ${val == 0 && val !== '' ? 'selected' : ''}>否 / 0</option></select>`
      : isText
        ? `<textarea data-field="${f}" placeholder="${esc(f)}">${esc(val)}</textarea>`
        : `<input type="text" data-field="${f}" value="${esc(val)}">`;
    return `<div class="form-item ${isText ? 'full' : ''}"><label>${esc(FIELD_LABELS[f] || f)}</label>${opts}</div>`;
  }).join('');
}
function closeModal() { hide('modalMask'); }
async function saveModal() {
  const payload = {};
  document.querySelectorAll('#modalForm [data-field]').forEach(el => {
    let v = el.value;
    const f = el.dataset.field;
    if (isJsonField(f)) {
      try { v = JSON.parse(v); } catch (e) { /* 保留字符串 */ }
    }
    payload[f] = v;
  });
  try {
    if (EDIT_ID) {
      await api('PUT', `/${CURRENT.name}/${EDIT_ID}`, payload);
      toast('已保存');
    } else {
      await api('POST', `/${CURRENT.name}`, payload);
      toast('已新增');
    }
    closeModal();
    renderTable();
  } catch (e) {
    toast('保存失败：' + e.message, true);
  }
}
async function delRow(id) {
  if (!confirm('确认删除该记录？此操作不可撤销。')) return;
  try {
    await api('DELETE', `/${CURRENT.name}/${id}`);
    toast('已删除');
    renderTable();
  } catch (e) {
    toast('删除失败：' + e.message, true);
  }
}

// ============ 启动 ============
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') doLogin();
});
(async function init() {
  if (TOKEN) {
    try {
      await api('GET', '/dashboard');
      document.getElementById('whoami').textContent = '管理员：已登录';
      enterApp();
    } catch (e) {
      TOKEN = ''; localStorage.removeItem('admin_token');
      show('loginPage'); hide('appPage');
    }
  } else {
    show('loginPage'); hide('appPage');
  }
})();
</script>
