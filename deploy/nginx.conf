# ============================================================
# AI 教学服务平台 · Nginx 反向代理 + HTTPS 终止
# 作用：
#   1. 443 终止 TLS（小程序要求 HTTPS + 已备案域名）
#   2. /api 反代到后端 FastAPI（8000）
#   3. 根路径托管 H5 产物（dist-h5）
# 证书：将 fullchain.pem / privkey.pem 放到 ./certs 目录
# ============================================================

# HTTP 80 全部跳转 HTTPS
server {
    listen 80;
    server_name your-domain.com;  # 改成你的已备案域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # 改成你的已备案域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- H5 静态站点（dist-h5）----
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API 反代 ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # 让 FastAPI 识别 https 协议
        proxy_read_timeout 120s;                      # AI 导师问答可能较慢
        proxy_connect_timeout 10s;
    }

    # 微信小程序不支持 WebSocket 无关，此处仅 HTTP
    client_max_body_size 10m;
}
