# ============================================================
# AI 教学服务平台 · 一键编排（后端 API + Nginx）
# 使用：
#   docker compose up -d
# 前置：
#   - 准备域名证书到 ./certs（fullchain.pem / privkey.pem）
#   - 前端 H5 产物构建到 ../dist-h5（npm run build:h5）
#   - 后端 .env 放到 ../backend/.env
# ============================================================
version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      # 容器内监听端口固定为 8010（与 expose / nginx.conf 的 proxy_pass 一致）
      - PORT=8010
    volumes:
      # 持久化数据库与处理数据（避免容器重建丢数据）
      - ai-teach-data:/app/data
    restart: unless-stopped
    expose:
      - "8010"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../dist-h5:/usr/share/nginx/html:ro   # H5 静态产物
    restart: unless-stopped

volumes:
  ai-teach-data:
