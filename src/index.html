<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <!-- 定宽 375 布局 + 由浏览器等比缩放到屏宽；viewport-fit=cover 让 iOS 全面屏可用 env(safe-area-inset-*)。
         不再写 user-scalable=no：保留双指放大能力（无障碍），新版 iOS/Android 本就忽略该限制。 -->
    <meta name="viewport" content="width=375,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no,address=no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>taro_template</title>
    <script>
      // 固定 html fontSize，防止 flexible 脚本动态修改
      (function() {
        var html = document.documentElement;
        html.style.fontSize = '18px';
        Object.defineProperty(html.style, 'fontSize', {
          get: function() { return '18px'; },
          set: function() { /* 忽略所有修改 */ }
        });
      })();
      <%= htmlWebpackPlugin.options.script %>
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
